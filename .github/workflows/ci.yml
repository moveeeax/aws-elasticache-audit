name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest

      - name: Audit a recorded region offline
        run: |
          set +e
          python examples/offline_demo.py risky
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 on the risky fixture, got $code" >&2
            exit 1
          fi
          python examples/offline_demo.py healthy

      - name: Check the console script is wired
        run: |
          aws-elasticache-audit --list-rules
          aws-elasticache-audit --version
