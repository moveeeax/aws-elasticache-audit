[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-elasticache-audit"
version = "0.1.0"
description = "Audit ElastiCache replication groups and cache clusters for the settings that turn losing one node into an incident"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Tarassov", email = "michael@tarassov.me" }]
keywords = ["aws", "elasticache", "redis", "memcached", "sre", "audit", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = ["boto3>=1.28"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
aws-elasticache-audit = "aws_elasticache_audit.cli:main"

[project.urls]
Homepage = "https://github.com/moveeeax/aws-elasticache-audit"
Issues = "https://github.com/moveeeax/aws-elasticache-audit/issues"

[tool.setuptools]
packages = ["aws_elasticache_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"
